
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8fc" />
  <title>10의 짝꿍수 덧셈·뺄셈 · 모바일</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#172033;
      --muted:#667085;
      --blue:#2563eb;
      --blue-soft:#eff6ff;
      --green:#16a34a;
      --green-soft:#ecfdf3;
      --red:#dc2626;
      --red-soft:#fff1f2;
      --orange:#f59e0b;
      --orange-soft:#fff7ed;
      --shadow:0 8px 24px rgba(15,23,42,.08);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    button,input,select{font:inherit}
    button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
    body{overscroll-behavior-y:contain}

    .app{width:100%;min-height:100vh;padding:10px}
    .topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:10px}
    .brand{min-width:180px}
    .brand h1{font-size:clamp(20px,2.6vw,31px);line-height:1.1;margin:0 0 3px}
    .brand p{margin:0;color:var(--muted);font-size:13px;font-weight:700}

    .settings{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
    .setting-group{display:flex;align-items:center;gap:5px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:5px}
    .setting-label{font-size:12px;font-weight:900;color:#475467;padding:0 3px;white-space:nowrap}
    .mode-select,.setting-select{border:0;background:#fff;color:#344054;border-radius:9px;padding:8px 10px;font-weight:900;outline:none}
    .mode-select{max-width:270px}
    .setting-select{min-width:82px}
    .start-btn,.reset-all-btn{border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer;white-space:nowrap}
    .start-btn{background:var(--blue);color:#fff;box-shadow:0 4px 0 #1d4ed8}
    .reset-all-btn{background:#eef2f7;color:#344054}
    .start-btn:active{transform:translateY(2px);box-shadow:none}


    .timer-display{
      min-width:92px;min-height:44px;padding:7px 11px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;gap:5px;
      background:#0f172a;color:#fff;font-size:19px;font-weight:1000;
      font-variant-numeric:tabular-nums;box-shadow:0 3px 0 #020617;
    }
    .timer-display::before{content:'⏱';font-size:16px}
    .timer-display.warning{background:#b45309;box-shadow:0 3px 0 #78350f}
    .timer-display.danger{background:#dc2626;box-shadow:0 3px 0 #991b1b;animation:timerPulse .75s ease-in-out infinite alternate}
    @keyframes timerPulse{from{transform:scale(1)}to{transform:scale(1.04)}}

    .countdown-screen{
      min-height:calc(100vh - 145px);display:flex;align-items:center;justify-content:center;
      background:#fff;border:2px solid #e2e8f0;border-radius:18px;box-shadow:var(--shadow);
    }
    .countdown-number{font-size:clamp(96px,30vw,170px);font-weight:1000;color:var(--blue);line-height:1}
    .time-up-title{font-size:clamp(24px,7vw,34px);font-weight:1000;margin-top:6px}
    .time-up-score{font-size:clamp(26px,8vw,40px);font-weight:1000;color:var(--blue);margin-top:12px}
    .player-panel.time-up{border-color:#f59e0b;background:linear-gradient(#fff,#fffbeb)}


    .game-board{
      display:grid;
      grid-template-columns:repeat(var(--players,1),minmax(0,1fr));
      gap:8px;
      align-items:stretch;
      width:100%;
    }

    .player-panel{
      min-width:0;
      min-height:calc(100vh - 110px);
      background:var(--card);
      border:2px solid #e2e8f0;
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      position:relative;
    }
    .player-panel.done{border-color:#86efac;background:linear-gradient(#fff,#f0fdf4)}
    .player-panel.fail-flash{animation:failFlash .55s ease}
    @keyframes failFlash{0%,100%{background:#fff}35%{background:#ffe4e6}65%{background:#fff}}

    .player-head{padding:9px 10px 8px;border-bottom:1px solid #e5e7eb;background:#fbfcfe}
    .player-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .player-name{font-size:clamp(15px,1.5vw,20px);font-weight:1000;color:#1d4ed8}
    .problem-count{font-size:12px;font-weight:900;color:#475467;white-space:nowrap}
    .progress-track{height:8px;background:#e7ebf1;border-radius:99px;overflow:hidden;margin-top:7px}
    .progress-fill{height:100%;width:0;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .22s ease}

    .player-body{flex:1;padding:11px 8px 12px;display:flex;flex-direction:column}
    .instruction{text-align:center;font-size:clamp(14px,1.55vw,20px);font-weight:1000;line-height:1.3;min-height:46px;display:flex;align-items:center;justify-content:center;padding:0 4px}
    .subhint{text-align:center;color:var(--muted);font-size:11px;font-weight:800;min-height:18px;margin-bottom:3px}
    .work-area{position:relative;flex:1;min-height:330px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}
    .hidden{display:none!important}

    /* 원래 식: 처음부터 끝까지 같은 위치 */
    .fixed-equation{
      min-height:112px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(4px,.8vw,10px);
      flex-wrap:nowrap;
      position:relative;
      z-index:5;
      margin-top:6px;
    }
    .token{
      width:clamp(54px,5.7vw,78px);
      height:clamp(54px,5.7vw,78px);
      border:3px solid #cbd5e1;
      border-radius:18px;
      background:#fff;
      display:grid;
      place-items:center;
      font-size:clamp(28px,3.6vw,48px);
      font-weight:1000;
      flex:0 0 auto;
      transition:opacity .28s ease,border-color .28s ease,background .28s ease,color .28s ease;
      position:relative;
    }
    .token.first{border-color:#93c5fd;background:var(--blue-soft)}
    .token.second{border-color:#cbd5e1}
    .token.trace{
      opacity:.22;
      border-style:dashed;
      background:#f8fafc;
      color:#64748b;
    }
    .token.paired{border-color:var(--green);background:var(--green-soft);color:#166534}
    .eq-symbol{font-size:clamp(27px,3.2vw,43px);font-weight:900;color:#475467;flex:0 0 auto}

    .answer-input{
      width:clamp(58px,6.2vw,84px);
      height:clamp(54px,5.7vw,78px);
      border:3px solid #94a3b8;
      border-radius:13px;
      background:#fff;
      text-align:center;
      outline:none;
      font-size:clamp(26px,3.4vw,44px);
      font-weight:1000;
      transition:opacity .2s ease,border-color .2s ease,background .2s ease;
    }
    .answer-input:disabled{opacity:.28;background:#f8fafc;cursor:not-allowed}
    .answer-input:focus,.split-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
    .answer-input.good,.split-input.good{border-color:var(--green);background:var(--green-soft)}
    .answer-input.bad,.split-input.bad{border-color:var(--red);background:var(--red-soft)}

    /* 받아올림: 두 번째 수 바로 아래에서 가르기 */
    .carry-work{position:relative;min-height:285px}
    .split-area{position:relative;min-height:178px;margin-top:-4px;z-index:4}
    .split-title{text-align:center;color:#475467;font-size:12px;font-weight:900;margin-top:0;min-height:18px}
    .split-row{display:flex;justify-content:center;gap:clamp(28px,5vw,62px);margin-top:30px;position:relative;z-index:4}
    .split-item{text-align:center;min-width:76px}
    .split-label{font-size:10px;line-height:1.2;color:var(--muted);font-weight:900;min-height:26px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:5px}
    .split-label.complement-label{font-size:12px;line-height:1.15;color:#15803d;font-weight:1000;min-height:auto;background:var(--green-soft);border:2px solid #86efac;border-radius:10px;padding:5px 8px;margin:0 auto 7px;box-shadow:0 2px 0 rgba(22,163,74,.12);white-space:nowrap}
    .split-input,.split-value{
      width:clamp(56px,5.8vw,76px);
      height:clamp(56px,5.8vw,76px);
      border:3px solid #94a3b8;
      border-radius:50%;
      background:#fff;
      text-align:center;
      outline:none;
      font-size:clamp(25px,3vw,39px);
      font-weight:1000;
    }
    .split-value{display:grid;place-items:center;margin:0 auto}
    .split-value.complement{border-color:var(--green);background:var(--green-soft);color:#166534}
    .split-value.rest{border-color:var(--orange);background:var(--orange-soft);color:#9a3412}
    .split-svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
    .pair-caption{position:absolute;z-index:6;color:#15803d;font-size:10px;font-weight:1000;background:#fff;padding:2px 5px;border-radius:8px;white-space:nowrap}

    /* 세 수에서 10 만들기: 원래 식 위치 유지 */
    .pair-fixed{min-height:240px;position:relative}
    .pair-num{
      width:clamp(54px,5.9vw,78px);
      height:clamp(54px,5.9vw,78px);
      border:3px solid #cbd5e1;
      border-radius:17px;
      background:#fff;
      font-size:clamp(28px,3.5vw,46px);
      font-weight:1000;
      cursor:pointer;
      display:grid;
      place-items:center;
      transition:border-color .2s ease,background .2s ease,color .2s ease;
      flex:0 0 auto;
    }
    .pair-num.selected{border-color:var(--blue);background:var(--blue-soft);color:#1d4ed8}
    .pair-num.paired{border-color:var(--green);background:var(--green-soft);color:#166534}
    .pair-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}

    /* 각 학생이 독립적으로 사용하는 숫자 키패드 */
    .keypad-wrap{
      width:min(100%,240px);
      margin:4px auto 2px;
      padding:7px;
      border:2px solid #dbe3ee;
      border-radius:15px;
      background:#f8fafc;
    }
    .keypad-title{
      text-align:center;
      color:#475467;
      font-size:11px;
      font-weight:1000;
      margin-bottom:5px;
    }
    .number-keypad{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:5px;
    }
    .key-btn{
      min-width:0;
      min-height:44px;
      border:2px solid #cbd5e1;
      border-radius:11px;
      background:#fff;
      color:#172033;
      font-size:21px;
      font-weight:1000;
      cursor:pointer;
      box-shadow:0 2px 0 #cbd5e1;
      touch-action:manipulation;
      user-select:none;
    }
    .key-btn:active{
      transform:translateY(1px);
      box-shadow:none;
      background:#eef2ff;
    }
    .key-btn.utility{
      font-size:14px;
      color:#475467;
      background:#f1f5f9;
    }
    .key-btn.backspace{font-size:22px}
    .keypad-active{
      border-color:var(--blue)!important;
      box-shadow:0 0 0 4px rgba(37,99,235,.14)!important;
    }

    .action-row{min-height:48px;display:flex;justify-content:center;align-items:center;margin-top:auto;padding-top:4px}
    .action-btn{border:0;border-radius:12px;padding:10px 14px;background:var(--blue);color:#fff;font-size:14px;font-weight:1000;cursor:pointer;box-shadow:0 4px 0 #1d4ed8;min-width:112px}
    .action-btn:active{transform:translateY(2px);box-shadow:none}
    .action-btn[disabled]{opacity:.45;cursor:default;box-shadow:none}

    .message{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(12px,1.25vw,16px);line-height:1.3;font-weight:1000;padding:5px 4px}
    .message.good{color:var(--green)}
    .message.bad{color:var(--red)}
    .message.info{color:var(--blue)}


    /* 뺄셈 1·2 공통 단계 표시 */
    .subtraction-work .split-area{min-height:142px}
    .sub-step-line{
      width:min(100%,320px);margin:5px auto 0;padding:5px 7px;
      display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
      border:2px solid #dbe3ee;border-radius:10px;background:#f8fafc;
      color:#334155;font-size:clamp(11px,1.15vw,15px);font-weight:1000;line-height:1.2;
      position:relative;z-index:6;
    }
    .step-arrow{color:#2563eb;font-size:16px;font-weight:1000}
    .buddy-chip{display:inline-grid;place-items:center;min-width:25px;height:25px;padding:0 6px;border:2px solid #16a34a;border-radius:99px;background:#ecfdf3;color:#15803d;font-weight:1000}
    .buddy-question{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
    .buddy-answer-input{width:52px;height:42px;border:3px solid #16a34a;border-radius:10px;background:#f0fdf4;color:#166534;text-align:center;font-size:24px;font-weight:1000;outline:none}
    .buddy-answer-input:focus,.buddy-answer-input.keypad-active{box-shadow:0 0 0 4px rgba(22,163,74,.16);border-color:#15803d}
    .buddy-label{display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;border-radius:9px;background:#ecfdf3;color:#15803d;border:2px solid #86efac;font-size:11px;font-weight:1000}
    .buddy-plus-step{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}

    .finish-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 8px}
    .finish-emoji{font-size:clamp(48px,6vw,76px)}
    .finish-title{font-size:clamp(20px,2.4vw,30px);font-weight:1000;margin:8px 0 4px}
    .finish-text{font-size:13px;color:var(--muted);font-weight:800;line-height:1.5}
    .again-one{margin-top:14px;border:0;border-radius:12px;padding:10px 16px;background:var(--green);color:#fff;font-weight:1000;cursor:pointer}

    /* 4~5인 화면 압축 */
    .game-board[data-count="4"] .player-body,
    .game-board[data-count="5"] .player-body{padding-left:5px;padding-right:5px}
    .game-board[data-count="5"] .instruction{font-size:14px}
    .game-board[data-count="5"] .subhint{font-size:10px}
    .game-board[data-count="5"] .fixed-equation{gap:3px}
    .game-board[data-count="5"] .token,
    .game-board[data-count="5"] .pair-num{width:50px;height:50px;font-size:28px;border-radius:14px}
    .game-board[data-count="5"] .eq-symbol{font-size:26px}
    .game-board[data-count="5"] .answer-input{width:52px;height:50px;font-size:27px}
    .game-board[data-count="5"] .split-input,
    .game-board[data-count="5"] .split-value{width:52px;height:52px;font-size:26px}
    .game-board[data-count="5"] .split-row{gap:20px}
    .game-board[data-count="4"] .keypad-wrap,
    .game-board[data-count="5"] .keypad-wrap{width:min(100%,190px);padding:5px}
    .game-board[data-count="5"] .key-btn{min-height:38px;font-size:18px}
    .game-board[data-count="5"] .key-btn.utility{font-size:12px}

    @media (max-width:1200px){
      .game-board[data-count="4"],.game-board[data-count="5"]{
        display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:7px;
      }
      .game-board[data-count="4"] .player-panel,.game-board[data-count="5"] .player-panel{
        flex:0 0 300px;scroll-snap-align:start;min-height:calc(100vh - 120px);
      }
      .mobile-tip.show-crowded{display:block}
    }

    @media (max-width:880px){
      .topbar{align-items:flex-start;flex-direction:column}
      .brand{width:100%}
      .settings{width:100%;justify-content:flex-start}
      .game-board[data-count="3"]{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:7px}
      .game-board[data-count="3"] .player-panel{flex:0 0 300px;scroll-snap-align:start}
      .mobile-tip.show-three{display:block}
    }

    @media (max-width:650px){
      .app{padding:7px}
      .topbar{border-radius:14px;padding:9px;margin-bottom:6px}
      .brand h1{font-size:21px}
      .brand p{font-size:12px}
      .setting-group{padding:4px}
      .setting-label{font-size:11px}
      .mode-select,.setting-select{font-size:13px;padding:7px 8px}
      .mode-select{max-width:190px}
      .setting-select{min-width:76px}
      .start-btn,.reset-all-btn{padding:9px 11px;font-size:13px}
      .timer-display{min-width:84px;min-height:40px;font-size:17px;padding:6px 8px}
      .game-board{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;gap:7px;padding-bottom:8px}
      .player-panel{flex:0 0 calc(100vw - 20px)!important;min-height:calc(100vh - 195px);scroll-snap-align:center;border-radius:15px}
      .work-area{min-height:330px}
      .instruction{font-size:16px;min-height:42px}
      .fixed-equation{min-height:98px}
      .token,.pair-num{width:60px;height:60px;font-size:33px}
      .answer-input{width:62px;height:60px;font-size:32px}
      .split-input,.split-value{width:60px;height:60px;font-size:30px}
      .split-row{margin-top:30px}
      .keypad-wrap{width:min(100%,260px);padding:7px}
      .key-btn{min-height:48px;font-size:23px}
      .key-btn.utility{font-size:14px}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>10의 짝꿍수 덧셈·뺄셈 · 모바일</h1>
        <p>1인용 · 제한 시간 안에 목표 문제에 도전해요.</p>
      </div>

      <div class="settings">
        <div class="setting-group">
          <span class="setting-label">학습</span>
          <select class="mode-select" id="modeSelect" aria-label="학습 유형">
            <option value="pair" selected>덧셈 ① 세 수에서 10 만들기</option>
            <option value="carry">덧셈 ② 받아올림 덧셈</option>
            <option value="sub1">뺄셈 1 — 빼는 수 가르기</option>
            <option value="sub2">뺄셈 2 — 앞의 수 가르기</option>
          </select>
        </div>


        <div class="setting-group">
          <span class="setting-label">목표</span>
          <select class="setting-select" id="goalSelect" aria-label="목표 문제 수 선택">
            <option value="5">5문제</option>
            <option value="10" selected>10문제</option>
            <option value="15">15문제</option>
            <option value="20">20문제</option>
          </select>
        </div>

        <div class="setting-group">
          <span class="setting-label">시간</span>
          <select class="setting-select" id="timerSelect" aria-label="제한 시간 선택">
            <option value="60" selected>1분</option>
            <option value="120">2분</option>
            <option value="180">3분</option>
          </select>
        </div>

        <div class="timer-display" id="timerDisplay" aria-live="polite">01:00</div>

        <button class="start-btn" id="startBtn">시작</button>
        <button class="reset-all-btn" id="resetAllBtn">처음부터</button>
      </div>
    </header>

    <section class="game-board" id="gameBoard" data-count="1" style="--players:1"></section>
  </main>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const rand = (min,max) => Math.floor(Math.random()*(max-min+1))+min;
      const shuffle = arr => {
        const a=[...arr];
        for(let i=a.length-1;i>0;i--){
          const j=Math.floor(Math.random()*(i+1));
          [a[i],a[j]]=[a[j],a[i]];
        }
        return a;
      };

      const playerCount=1;
      let goal=10;
      let mode='pair';
      let roundSeconds=60;
      let timeRemaining=60;
      let games=[];
      let countdownInterval=null;
      let gameTimerInterval=null;
      let roundRunning=false;

      let audioCtx=null;
      function tone(freq,duration=.1,type='sine',delay=0,gain=.035){
        try{
          audioCtx ??= new (window.AudioContext||window.webkitAudioContext)();
          const o=audioCtx.createOscillator();
          const g=audioCtx.createGain();
          o.type=type;o.frequency.value=freq;g.gain.value=gain;
          o.connect(g);g.connect(audioCtx.destination);
          const t=audioCtx.currentTime+delay;
          o.start(t);o.stop(t+duration);
        }catch(e){}
      }
      const soundGood=()=>{tone(660,.08,'sine',0,.035);tone(880,.12,'sine',.09,.035)};
      const soundBad=()=>{tone(170,.12,'square',0,.02);tone(125,.16,'square',.12,.018)};
      const soundDone=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.13,'sine',i*.09,.035))};
      const soundStart=()=>{tone(440,.08,'sine',0,.03);tone(660,.1,'sine',.09,.03)};
      const soundCount=()=>tone(520,.11,'sine',0,.04);
      const soundTimeUp=()=>{tone(220,.18,'square',0,.025);tone(165,.28,'square',.2,.022)};

      function formatTime(totalSeconds){
        const sec=Math.max(0,Number(totalSeconds)||0);
        const m=Math.floor(sec/60);
        const s=sec%60;
        return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }

      function updateTimerDisplay(){
        const display=$('timerDisplay');
        if(!display)return;
        display.textContent=formatTime(timeRemaining);
        display.classList.toggle('danger',roundRunning && timeRemaining<=10);
        display.classList.toggle('warning',roundRunning && timeRemaining>10 && timeRemaining<=30);
      }

      function setSettingsLocked(locked){
        ['modeSelect','goalSelect','timerSelect'].forEach(id=>{
          const el=$(id); if(el)el.disabled=locked;
        });
        const start=$('startBtn');
        if(start){
          start.disabled=locked;
          start.textContent=locked?(countdownInterval?'준비 중':'진행 중'):'시작';
        }
      }

      function stopRoundTimers(){
        if(countdownInterval){clearInterval(countdownInterval);countdownInterval=null;}
        if(gameTimerInterval){clearInterval(gameTimerInterval);gameTimerInterval=null;}
      }

      function clearGames(){
        games.forEach(g=>g.clearTimers());
        games=[];
        $('gameBoard').innerHTML='';
      }

      function resetToBlank(){
        stopRoundTimers();
        roundRunning=false;
        clearGames();
        goal=Number($('goalSelect').value);
        mode=$('modeSelect').value;
        roundSeconds=Number($('timerSelect').value);
        timeRemaining=roundSeconds;
        const board=$('gameBoard');
        board.dataset.count='1';
        board.style.setProperty('--players',1);
        setSettingsLocked(false);
        updateTimerDisplay();
      }

      function renderCountdown(n){
        $('gameBoard').innerHTML=`<div class="countdown-screen"><div class="countdown-number" aria-live="assertive">${n}</div></div>`;
        soundCount();
      }

      function beginCountdown(){
        if(roundRunning||countdownInterval)return;
        goal=Number($('goalSelect').value);
        mode=$('modeSelect').value;
        roundSeconds=Number($('timerSelect').value);
        timeRemaining=roundSeconds;
        stopRoundTimers();
        clearGames();
        setSettingsLocked(true);
        updateTimerDisplay();
        let count=3;
        renderCountdown(count);
        countdownInterval=setInterval(()=>{
          count--;
          if(count>0) renderCountdown(count);
          else{
            clearInterval(countdownInterval);
            countdownInterval=null;
            startAll();
          }
        },1000);
      }

      function startGameClock(){
        roundRunning=true;
        timeRemaining=roundSeconds;
        updateTimerDisplay();
        gameTimerInterval=setInterval(()=>{
          timeRemaining--;
          updateTimerDisplay();
          if(timeRemaining<=0){
            clearInterval(gameTimerInterval);
            gameTimerInterval=null;
            endByTime();
          }
        },1000);
      }

      function endByTime(){
        if(!roundRunning)return;
        roundRunning=false;
        timeRemaining=0;
        updateTimerDisplay();
        games.forEach(g=>g.timeUp());
        soundTimeUp();
        setSettingsLocked(false);
      }

      function finishRoundOnGoal(){
        if(!roundRunning)return;
        roundRunning=false;
        if(gameTimerInterval){clearInterval(gameTimerInterval);gameTimerInterval=null;}
        updateTimerDisplay();
        setSettingsLocked(false);
      }

      $('goalSelect').addEventListener('change',e=>{goal=Number(e.target.value)});
      $('modeSelect').addEventListener('change',e=>{mode=e.target.value});
      $('timerSelect').addEventListener('change',e=>{
        roundSeconds=Number(e.target.value);
        if(!roundRunning&&!countdownInterval){timeRemaining=roundSeconds;updateTimerDisplay();}
      });
      $('startBtn').addEventListener('click',beginCountdown);
      $('resetAllBtn').addEventListener('click',resetToBlank);

      class PlayerGame{
        constructor(index,mode,goal){
          this.index=index;
          this.mode=mode;
          this.goal=goal;
          this.solved=0;
          this.mistakes=0;
          this.locked=false;
          this.phase='start';
          this.q=null;
          this.selected=[];
          this.timers=[];
          this.activeInput=null;
          this.panel=this.buildPanel();
          this.newQuestion();
        }

        buildPanel(){
          const panel=document.createElement('section');
          panel.className='player-panel';
          panel.innerHTML=`
            <div class="player-head">
              <div class="player-head-row">
                <div class="player-name">나의 도전</div>
                <div class="problem-count"><span data-role="count">0 / ${this.goal}</span></div>
              </div>
              <div class="progress-track"><div class="progress-fill" data-role="progress"></div></div>
            </div>
            <div class="player-body">
              <div class="instruction" data-role="instruction"></div>
              <div class="subhint" data-role="subhint"></div>
              <div class="work-area" data-role="work"></div>
              <div class="keypad-wrap hidden" data-role="keypad" aria-label="숫자 키패드">
                <div class="keypad-title">숫자 키패드</div>
                <div class="number-keypad">
                  <button type="button" class="key-btn" data-key="1">1</button>
                  <button type="button" class="key-btn" data-key="2">2</button>
                  <button type="button" class="key-btn" data-key="3">3</button>
                  <button type="button" class="key-btn" data-key="4">4</button>
                  <button type="button" class="key-btn" data-key="5">5</button>
                  <button type="button" class="key-btn" data-key="6">6</button>
                  <button type="button" class="key-btn" data-key="7">7</button>
                  <button type="button" class="key-btn" data-key="8">8</button>
                  <button type="button" class="key-btn" data-key="9">9</button>
                  <button type="button" class="key-btn utility" data-key="clear">지우기</button>
                  <button type="button" class="key-btn" data-key="0">0</button>
                  <button type="button" class="key-btn utility backspace" data-key="back" aria-label="한 글자 지우기">←</button>
                </div>
              </div>
              <div class="action-row" data-role="actions"></div>
              <div class="message" data-role="message" aria-live="polite"></div>
            </div>`;
          $('gameBoard').appendChild(panel);
          panel.querySelectorAll('[data-key]').forEach(btn=>{
            btn.addEventListener('click',()=>this.handleKey(btn.dataset.key));
          });
          return panel;
        }

        el(role){return this.panel.querySelector(`[data-role="${role}"]`)}

        bindNumericInput(input,maxLen=2){
          if(!input)return;
          input.readOnly=true;
          input.setAttribute('inputmode','none');
          input.dataset.maxlen=String(maxLen);
          input.addEventListener('click',()=>this.setActiveInput(input));
          input.addEventListener('focus',()=>this.setActiveInput(input));
          input.addEventListener('keydown',e=>{
            if(/^\d$/.test(e.key)){
              e.preventDefault();
              this.handleKey(e.key);
            }else if(e.key==='Backspace'){
              e.preventDefault();
              this.handleKey('back');
            }else if(e.key==='Delete'){
              e.preventDefault();
              this.handleKey('clear');
            }
          });
        }

        setActiveInput(input){
          if(this.activeInput && this.activeInput.isConnected){
            this.activeInput.classList.remove('keypad-active');
          }
          if(!input || !input.isConnected || input.disabled){
            this.activeInput=null;
            const keypad=this.el('keypad');
            if(keypad)keypad.classList.add('hidden');
            return;
          }
          this.activeInput=input;
          input.classList.add('keypad-active');
          const keypad=this.el('keypad');
          if(keypad)keypad.classList.remove('hidden');
        }

        handleKey(key){
          if(this.locked || !this.activeInput || !this.activeInput.isConnected || this.activeInput.disabled)return;
          const input=this.activeInput;
          const maxLen=Math.max(1,Number(input.dataset.maxlen)||2);
          if(key==='clear'){
            input.value='';
          }else if(key==='back'){
            input.value=input.value.slice(0,-1);
          }else if(/^\d$/.test(key)){
            if(input.value.length>=maxLen)input.value='';
            input.value=(input.value+key).slice(0,maxLen);
          }
          input.classList.remove('bad');

          /* 가르기 첫 칸 입력 후 두 번째 칸으로 자동 이동하고,
             두 번째 칸까지 입력되면 별도 확인 버튼 없이 자동 채점합니다. */
          if(input.dataset.role==='splitA' && input.value.length>=maxLen){
            const next=this.el('work').querySelector('[data-role="splitB"]');
            if(next && !next.classList.contains('hidden'))this.setActiveInput(next);
          }else if(input.dataset.role==='splitB' && /^\d$/.test(key) && input.value.length>=1){
            const first=this.el('work').querySelector('[data-role="splitA"]');
            if(first && first.value.trim()!=='')this.checkSplit();
          }else if(input.dataset.role==='buddyAnswer' && /^\d$/.test(key) && input.value.length>=1){
            this.checkSub2Buddy();
          }
        }

        setMessage(text='',type=''){
          const m=this.el('message');
          m.textContent=text;
          m.className='message'+(type?' '+type:'');
        }

        clearTimers(){this.timers.forEach(clearTimeout);this.timers=[]}
        later(fn,ms){const id=setTimeout(fn,ms);this.timers.push(id)}

        updateProgress(){
          this.el('count').textContent=`${this.solved} / ${this.goal}`;
          this.el('progress').style.width=`${(this.solved/this.goal)*100}%`;
        }

        newQuestion(){
          this.clearTimers();
          this.locked=false;
          this.phase='start';
          this.selected=[];
          this.setActiveInput(null);
          this.panel.classList.remove('done','time-up');
          this.updateProgress();
          this.setMessage('');
          if(this.mode==='carry') this.makeCarry();
          else if(this.mode==='sub1') this.makeSub1();
          else if(this.mode==='sub2') this.makeSub2();
          else this.makePair();
        }

        /* ---------- 받아올림 ---------- */
        makeCarry(){
          const first=rand(5,9);
          const complement=10-first;
          const second=rand(complement+1,9);
          const rest=second-complement;
          this.q={first,complement,second,rest,answer:first+second};

          this.el('instruction').innerHTML=`문제 ${this.solved+1} · <strong>${first} + ${second}</strong>`;
          this.el('subhint').textContent='두 수를 입력하면 자동으로 확인돼요. 원래 식의 자리는 그대로 두어요.';
          this.el('work').innerHTML=`
            <div class="carry-work" data-role="carryWork">
              <div class="fixed-equation" data-role="carryEq">
                <div class="token first" data-role="firstToken">${first}</div>
                <div class="eq-symbol">+</div>
                <div class="token second" data-role="secondToken">${second}</div>
                <div class="eq-symbol">=</div>
                <input class="answer-input" data-role="finalAnswer" inputmode="numeric" pattern="[0-9]*" aria-label="최종 답" disabled>
              </div>

              <div class="split-area" data-role="splitArea">
                <svg class="split-svg" data-role="splitSvg" aria-hidden="true"></svg>
                <div class="split-title">${second}를 두 수로 가르세요.</div>
                <div class="split-row">
                  <div class="split-item">
                    <div class="split-label complement-label">${first}의 10짝꿍수</div>
                    <input class="split-input" data-role="splitA" inputmode="numeric" pattern="[0-9]*" aria-label="${first}의 10짝꿍수">
                    <div class="split-value complement hidden" data-role="splitAValue"></div>
                  </div>
                  <div class="split-item">
                    <div class="split-label">남는 수</div>
                    <input class="split-input" data-role="splitB" inputmode="numeric" pattern="[0-9]*" aria-label="남는 수">
                    <div class="split-value rest hidden" data-role="splitBValue"></div>
                  </div>
                </div>
                <div class="pair-caption hidden" data-role="pairCaption">10 짝꿍</div>
              </div>
            </div>`;

          this.el('actions').innerHTML='';
          const work=this.el('work');
          const a=work.querySelector('[data-role="splitA"]');
          const b=work.querySelector('[data-role="splitB"]');
          const finalAnswer=work.querySelector('[data-role="finalAnswer"]');
          this.bindNumericInput(a,1);
          this.bindNumericInput(b,1);
          this.bindNumericInput(finalAnswer,2);
          finalAnswer.addEventListener('keydown',e=>{if(e.key==='Enter')this.checkFinal()});
          a.addEventListener('keydown',e=>{if(e.key==='Enter')b.focus()});
          b.addEventListener('keydown',e=>{if(e.key==='Enter')this.checkSplit()});
          requestAnimationFrame(()=>this.drawCarryGuide());
          this.setActiveInput(a);
        }

        drawCarryGuide(){
          if(this.mode!=='carry')return;
          const work=this.el('work');
          const area=work.querySelector('[data-role="splitArea"]');
          const svg=work.querySelector('[data-role="splitSvg"]');
          const second=work.querySelector('[data-role="secondToken"]');
          const first=work.querySelector('[data-role="firstToken"]');
          const useSplitInputs=this.phase==='start';
          const aRef=work.querySelector(useSplitInputs?'[data-role="splitA"]':'[data-role="splitAValue"]');
          const bRef=work.querySelector(useSplitInputs?'[data-role="splitB"]':'[data-role="splitBValue"]');
          if(!area||!svg||!second||!first||!aRef||!bRef)return;

          const ar=area.getBoundingClientRect();
          const sr=second.getBoundingClientRect();
          const fr=first.getBoundingClientRect();
          const rrA=aRef.getBoundingClientRect();
          const rrB=bRef.getBoundingClientRect();
          if(!ar.width||!rrA.width)return;

          const sx=sr.left-ar.left+sr.width/2;
          const sy=sr.bottom-ar.top+2;
          const ax=rrA.left-ar.left+rrA.width/2;
          const ay=rrA.top-ar.top-7;
          const bx=rrB.left-ar.left+rrB.width/2;
          const by=rrB.top-ar.top-7;
          const mid=sy+14;

          let html=`
            <path d="M ${sx} ${sy} L ${sx} ${mid}" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M ${sx} ${mid} Q ${sx-4} ${mid+14} ${ax} ${ay}" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M ${sx} ${mid} Q ${sx+4} ${mid+14} ${bx} ${by}" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>`;

          if(this.phase==='answer'){
            const fx=fr.left-ar.left+fr.width/2;
            const fy=fr.bottom-ar.top+2;
            const greenY=Math.max(fy+18, ay-20);
            html+=`
              <path d="M ${fx} ${fy} Q ${fx} ${greenY} ${ax} ${ay-3}" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
            `;
            const caption=work.querySelector('[data-role="pairCaption"]');
            caption.classList.remove('hidden');
            caption.style.left=`${Math.max(4,(fx+ax)/2-28)}px`;
            caption.style.top=`${Math.max(5,greenY-18)}px`;
          }

          svg.setAttribute('viewBox',`0 0 ${ar.width} ${ar.height}`);
          svg.innerHTML=html;
        }

        checkSplit(){
          if(this.locked||this.phase!=='start')return;
          const work=this.el('work');
          const aEl=work.querySelector('[data-role="splitA"]');
          const bEl=work.querySelector('[data-role="splitB"]');
          const aRaw=aEl.value.trim();
          const bRaw=bEl.value.trim();
          if(aRaw===''||bRaw===''){
            this.setMessage('두 칸에 모두 수를 넣어 주세요.','info');
            return;
          }
          const a=Number(aRaw), b=Number(bRaw);

          if(this.mode==='carry'){
            if(a===this.q.complement && b===this.q.rest && a+b===this.q.second){
              this.locked=true;
              aEl.classList.add('good');bEl.classList.add('good');
              soundGood();
              this.showSplitResult();
            }else{
              aEl.classList.add('bad');bEl.classList.add('bad');
              this.failAndRestart(`${this.q.first}의 10짝꿍수를 다시 생각해 보세요.`);
            }
            return;
          }

          if(this.mode==='sub1'){
            if(a===this.q.ones && b===this.q.rest && a+b===this.q.subtrahend){
              this.locked=true;
              aEl.classList.add('good');bEl.classList.add('good');
              soundGood();
              this.showSubResult();
            }else{
              aEl.classList.add('bad');bEl.classList.add('bad');
              this.failAndRestart(`${this.q.subtrahend}를 ${this.q.ones}와 ${this.q.rest}로 가르는 방법을 다시 생각해 보세요.`);
            }
            return;
          }

          if(this.mode==='sub2'){
            if(a===10 && b===this.q.ones && a+b===this.q.minuend){
              this.locked=true;
              aEl.classList.add('good');bEl.classList.add('good');
              soundGood();
              this.showSubResult();
            }else{
              aEl.classList.add('bad');bEl.classList.add('bad');
              this.failAndRestart(`${this.q.minuend}를 10과 ${this.q.ones}로 가르는 방법을 다시 생각해 보세요.`);
            }
          }
        }

        showSplitResult(){
          this.phase='answer';
          const work=this.el('work');
          const second=work.querySelector('[data-role="secondToken"]');
          const aInput=work.querySelector('[data-role="splitA"]');
          const bInput=work.querySelector('[data-role="splitB"]');
          const aValue=work.querySelector('[data-role="splitAValue"]');
          const bValue=work.querySelector('[data-role="splitBValue"]');
          const answer=work.querySelector('[data-role="finalAnswer"]');

          /* 원래 두 번째 수는 지우지 않고 '흔적'만 남긴다. */
          second.classList.add('trace');

          aValue.textContent=this.q.complement;
          bValue.textContent=this.q.rest;
          aInput.classList.add('hidden');
          bInput.classList.add('hidden');
          aValue.classList.remove('hidden');
          bValue.classList.remove('hidden');

          answer.disabled=false;
          this.el('actions').innerHTML=`<button class="action-btn" data-role="checkAnswer">정답 확인</button>`;
          this.el('actions').querySelector('[data-role="checkAnswer"]').addEventListener('click',()=>this.checkFinal());
          this.setMessage(`${this.q.second}는 흔적만 남기고, ${this.q.complement}와 ${this.q.rest}(으)로 갈랐어요. ${this.q.first}와 ${this.q.complement}가 10의 짝꿍이에요.`, 'good');
          this.locked=false;
          requestAnimationFrame(()=>this.drawCarryGuide());
          this.setActiveInput(answer);
        }

        /* ---------- 뺄셈 1 : 빼는 수 가르기 ---------- */
        makeSub1(){
          const minuend=rand(11,18);
          const ones=minuend-10;
          const subtrahend=rand(ones+1,9);
          const rest=subtrahend-ones;
          const answer=minuend-subtrahend;
          this.q={kind:'sub1',minuend,ones,subtrahend,rest,answer};

          this.el('instruction').innerHTML=`문제 ${this.solved+1} · <strong>뺄셈 1 · ${minuend} - ${subtrahend}</strong>`;
          this.el('subhint').textContent=`${subtrahend}를 가른 뒤, 먼저 ${minuend}에서 ${ones}을 빼서 10을 만들어요.`;
          this.el('work').innerHTML=`
            <div class="carry-work subtraction-work" data-role="subWork">
              <div class="fixed-equation" data-role="subEq">
                <div class="token first" data-role="firstToken">${minuend}</div>
                <div class="eq-symbol">−</div>
                <div class="token second" data-role="secondToken">${subtrahend}</div>
                <div class="eq-symbol">=</div>
                <input class="answer-input" data-role="finalAnswer" inputmode="numeric" pattern="[0-9]*" aria-label="최종 답" disabled>
              </div>
              <div class="split-area" data-role="splitArea">
                <svg class="split-svg" data-role="splitSvg" aria-hidden="true"></svg>
                <div class="split-title">${subtrahend}를 두 수로 가르세요.</div>
                <div class="split-row">
                  <div class="split-item">
                    <div class="split-label complement-label">${minuend}에서 먼저 뺄 수</div>
                    <input class="split-input" data-role="splitA" inputmode="numeric" pattern="[0-9]*" aria-label="먼저 뺄 수">
                    <div class="split-value complement hidden" data-role="splitAValue"></div>
                  </div>
                  <div class="split-item">
                    <div class="split-label">남는 수</div>
                    <input class="split-input" data-role="splitB" inputmode="numeric" pattern="[0-9]*" aria-label="남는 수">
                    <div class="split-value rest hidden" data-role="splitBValue"></div>
                  </div>
                </div>
                <div class="sub-step-line hidden" data-role="subStep"></div>
              </div>
            </div>`;

          this.el('actions').innerHTML='';
          const work=this.el('work');
          const a=work.querySelector('[data-role="splitA"]');
          const b=work.querySelector('[data-role="splitB"]');
          const finalAnswer=work.querySelector('[data-role="finalAnswer"]');
          this.bindNumericInput(a,1);
          this.bindNumericInput(b,1);
          this.bindNumericInput(finalAnswer,2);
          finalAnswer.addEventListener('keydown',e=>{if(e.key==='Enter')this.checkFinal()});
          a.addEventListener('keydown',e=>{if(e.key==='Enter')b.focus()});
          b.addEventListener('keydown',e=>{if(e.key==='Enter')this.checkSplit()});
          requestAnimationFrame(()=>this.drawSubGuide());
          this.setActiveInput(a);
        }

        /* ---------- 뺄셈 2 : 앞의 수를 10과 나머지로 가르기 ---------- */
        makeSub2(){
          const minuend=rand(11,18);
          const ones=minuend-10;
          const subtrahend=rand(ones+1,9);
          const buddy=10-subtrahend;
          const answer=minuend-subtrahend;
          this.q={kind:'sub2',minuend,ones,subtrahend,buddy,answer};

          this.el('instruction').innerHTML=`문제 ${this.solved+1} · <strong>뺄셈 2 · ${minuend} - ${subtrahend}</strong>`;
          this.el('subhint').textContent=`${minuend}를 10과 ${ones}로 가른 뒤, ${subtrahend}의 10짝꿍수를 직접 구하고 남는 수 ${ones}와 더해요.`;
          this.el('work').innerHTML=`
            <div class="carry-work subtraction-work" data-role="subWork">
              <div class="fixed-equation" data-role="subEq">
                <div class="token first" data-role="firstToken">${minuend}</div>
                <div class="eq-symbol">−</div>
                <div class="token second" data-role="secondToken">${subtrahend}</div>
                <div class="eq-symbol">=</div>
                <input class="answer-input" data-role="finalAnswer" inputmode="numeric" pattern="[0-9]*" aria-label="최종 답" disabled>
              </div>
              <div class="split-area" data-role="splitArea">
                <svg class="split-svg" data-role="splitSvg" aria-hidden="true"></svg>
                <div class="split-title">${minuend}를 10과 나머지로 가르세요.</div>
                <div class="split-row">
                  <div class="split-item">
                    <div class="split-label complement-label">10</div>
                    <input class="split-input" data-role="splitA" inputmode="numeric" pattern="[0-9]*" aria-label="10">
                    <div class="split-value complement hidden" data-role="splitAValue"></div>
                  </div>
                  <div class="split-item">
                    <div class="split-label">남는 수</div>
                    <input class="split-input" data-role="splitB" inputmode="numeric" pattern="[0-9]*" aria-label="남는 수">
                    <div class="split-value rest hidden" data-role="splitBValue"></div>
                  </div>
                </div>
                <div class="sub-step-line hidden" data-role="subStep"></div>
              </div>
            </div>`;

          this.el('actions').innerHTML='';
          const work=this.el('work');
          const a=work.querySelector('[data-role="splitA"]');
          const b=work.querySelector('[data-role="splitB"]');
          const finalAnswer=work.querySelector('[data-role="finalAnswer"]');
          this.bindNumericInput(a,2);
          this.bindNumericInput(b,1);
          this.bindNumericInput(finalAnswer,2);
          finalAnswer.addEventListener('keydown',e=>{if(e.key==='Enter')this.checkFinal()});
          a.addEventListener('keydown',e=>{if(e.key==='Enter')b.focus()});
          b.addEventListener('keydown',e=>{if(e.key==='Enter')this.checkSplit()});
          requestAnimationFrame(()=>this.drawSubGuide());
          this.setActiveInput(a);
        }

        drawSubGuide(){
          if(this.mode!=='sub1'&&this.mode!=='sub2')return;
          const work=this.el('work');
          const area=work.querySelector('[data-role="splitArea"]');
          const svg=work.querySelector('[data-role="splitSvg"]');
          const target=work.querySelector(this.mode==='sub1'?'[data-role="secondToken"]':'[data-role="firstToken"]');
          const useSplitInputs=this.phase==='start';
          const aRef=work.querySelector(useSplitInputs?'[data-role="splitA"]':'[data-role="splitAValue"]');
          const bRef=work.querySelector(useSplitInputs?'[data-role="splitB"]':'[data-role="splitBValue"]');
          if(!area||!svg||!target||!aRef||!bRef)return;

          const ar=area.getBoundingClientRect();
          const tr=target.getBoundingClientRect();
          const rrA=aRef.getBoundingClientRect();
          const rrB=bRef.getBoundingClientRect();
          if(!ar.width||!rrA.width)return;

          const sx=tr.left-ar.left+tr.width/2;
          const sy=tr.bottom-ar.top+2;
          const ax=rrA.left-ar.left+rrA.width/2;
          const ay=rrA.top-ar.top-7;
          const bx=rrB.left-ar.left+rrB.width/2;
          const by=rrB.top-ar.top-7;
          const mid=sy+12;

          svg.setAttribute('viewBox',`0 0 ${ar.width} ${ar.height}`);
          svg.innerHTML=`
            <path d="M ${sx} ${sy} L ${sx} ${mid}" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M ${sx} ${mid} Q ${sx-4} ${mid+12} ${ax} ${ay}" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M ${sx} ${mid} Q ${sx+4} ${mid+12} ${bx} ${by}" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>`;
        }

        showSubResult(){
          const work=this.el('work');
          const aInput=work.querySelector('[data-role="splitA"]');
          const bInput=work.querySelector('[data-role="splitB"]');
          const aValue=work.querySelector('[data-role="splitAValue"]');
          const bValue=work.querySelector('[data-role="splitBValue"]');
          const answer=work.querySelector('[data-role="finalAnswer"]');
          const step=work.querySelector('[data-role="subStep"]');
          const target=work.querySelector(this.mode==='sub1'?'[data-role="secondToken"]':'[data-role="firstToken"]');

          target.classList.add('trace');
          aInput.classList.add('hidden');
          bInput.classList.add('hidden');
          aValue.classList.remove('hidden');
          bValue.classList.remove('hidden');
          step.classList.remove('hidden');

          if(this.mode==='sub1'){
            this.phase='answer';
            aValue.textContent=this.q.ones;
            bValue.textContent=this.q.rest;
            step.innerHTML=`<span>${this.q.minuend} − ${this.q.ones} = <strong>10</strong></span><span class="step-arrow">→</span><span>10 − ${this.q.rest} = ?</span>`;
            this.setMessage(`${this.q.subtrahend}를 ${this.q.ones}와 ${this.q.rest}로 갈랐어요. 먼저 10을 만들고 남은 수를 빼요.`,'good');
            answer.disabled=false;
            this.el('actions').innerHTML=`<button class="action-btn" data-role="checkAnswer">정답 확인</button>`;
            this.el('actions').querySelector('[data-role="checkAnswer"]').addEventListener('click',()=>this.checkFinal());
            this.locked=false;
            requestAnimationFrame(()=>this.drawSubGuide());
            this.setActiveInput(answer);
            return;
          }

          /* 뺄셈 2: 앞 수를 10과 나머지로 가른 뒤,
             빼는 수의 10짝꿍수를 학생이 직접 구하고 나서 남는 수와 더합니다. */
          this.phase='buddy';
          aValue.textContent=10;
          bValue.textContent=this.q.ones;
          answer.disabled=true;
          step.innerHTML=`
            <span class="buddy-question">10 − ${this.q.subtrahend} =
              <input class="buddy-answer-input" data-role="buddyAnswer" inputmode="numeric" pattern="[0-9]*" aria-label="${this.q.subtrahend}의 10짝꿍수">
            </span>
            <span class="buddy-label">${this.q.subtrahend}의 10짝꿍수 먼저 구하기</span>`;
          this.el('actions').innerHTML='';
          this.setMessage(`먼저 ${this.q.subtrahend}의 10짝꿍수를 구하세요. 그 다음 남는 수 ${this.q.ones}와 더할 거예요.`,'info');
          this.locked=false;
          const buddyInput=step.querySelector('[data-role="buddyAnswer"]');
          this.bindNumericInput(buddyInput,1);
          buddyInput.addEventListener('keydown',e=>{if(e.key==='Enter')this.checkSub2Buddy()});
          requestAnimationFrame(()=>this.drawSubGuide());
          this.setActiveInput(buddyInput);
        }

        checkSub2Buddy(){
          if(this.locked||this.mode!=='sub2'||this.phase!=='buddy')return;
          const work=this.el('work');
          const buddyInput=work.querySelector('[data-role="buddyAnswer"]');
          if(!buddyInput)return;
          const raw=buddyInput.value.trim();
          if(raw===''){
            this.setMessage(`${this.q.subtrahend}의 10짝꿍수를 입력해 주세요.`,'info');
            return;
          }

          if(Number(raw)!==this.q.buddy){
            buddyInput.classList.add('bad');
            this.failAndRestart(`${this.q.subtrahend}의 10짝꿍수를 다시 생각해 보세요.`);
            return;
          }

          this.locked=true;
          buddyInput.classList.add('good');
          soundGood();

          const step=work.querySelector('[data-role="subStep"]');
          const answer=work.querySelector('[data-role="finalAnswer"]');
          this.phase='answer';
          step.innerHTML=`
            <span>10 − ${this.q.subtrahend} = <span class="buddy-chip">${this.q.buddy}</span></span>
            <span class="step-arrow">→</span>
            <span class="buddy-plus-step"><span class="buddy-chip">${this.q.ones}</span> + <span class="buddy-chip">${this.q.buddy}</span> = ?</span>`;
          answer.disabled=false;
          this.el('actions').innerHTML=`<button class="action-btn" data-role="checkAnswer">정답 확인</button>`;
          this.el('actions').querySelector('[data-role="checkAnswer"]').addEventListener('click',()=>this.checkFinal());
          this.setMessage(`맞아요! ${this.q.subtrahend}의 10짝꿍수는 ${this.q.buddy}예요. 이제 남는 수 ${this.q.ones}와 ${this.q.buddy}를 더하세요.`,'good');
          this.locked=false;
          this.setActiveInput(answer);
        }

        /* ---------- 세 수에서 10 만들기 ---------- */
        makePair(){
          let a,b,c;
          do{
            a=rand(1,9);b=10-a;c=rand(1,9);
          }while(c===a||c===b);
          const values=shuffle([a,b,c]);
          this.q={values,answer:values.reduce((s,v)=>s+v,0)};

          this.el('instruction').innerHTML=`문제 ${this.solved+1} · <strong>10이 되는 두 수를 찾으세요.</strong>`;
          this.el('subhint').textContent='10이 되는 두 수를 고른 뒤, 숫자 키패드로 답을 입력해요.';

          const parts=[];
          values.forEach((v,i)=>{
            parts.push(`<button class="pair-num" data-role="pairNum" data-i="${i}">${v}</button>`);
            if(i<2)parts.push(`<span class="eq-symbol">+</span>`);
          });
          parts.push(`<span class="eq-symbol">=</span>`);
          parts.push(`<input class="answer-input" data-role="finalAnswer" inputmode="numeric" pattern="[0-9]*" aria-label="최종 답" disabled>`);

          this.el('work').innerHTML=`
            <div class="pair-fixed" data-role="pairFixed">
              <svg class="pair-svg" data-role="pairSvg" aria-hidden="true"></svg>
              <div class="fixed-equation" data-role="pairEq">${parts.join('')}</div>
            </div>`;
          this.el('actions').innerHTML='';

          const work=this.el('work');
          const finalAnswer=work.querySelector('[data-role="finalAnswer"]');
          this.bindNumericInput(finalAnswer,2);
          work.querySelectorAll('[data-role="pairNum"]').forEach(btn=>btn.addEventListener('click',()=>this.pickPair(Number(btn.dataset.i),btn)));
          finalAnswer.addEventListener('keydown',e=>{if(e.key==='Enter')this.checkFinal()});
        }

        pickPair(i,btn){
          if(this.locked||this.phase!=='start')return;
          if(this.selected.includes(i)){
            this.selected=this.selected.filter(x=>x!==i);
            btn.classList.remove('selected');
            return;
          }
          if(this.selected.length>=2)return;
          this.selected.push(i);
          btn.classList.add('selected');

          if(this.selected.length===2){
            const sum=this.selected.reduce((s,idx)=>s+this.q.values[idx],0);
            if(sum===10){
              this.locked=true;
              soundGood();
              const nums=this.el('work').querySelectorAll('[data-role="pairNum"]');
              nums.forEach((el,idx)=>{
                if(this.selected.includes(idx)){
                  el.classList.remove('selected');
                  el.classList.add('paired');
                }
              });
              this.phase='answer';
              const answer=this.el('work').querySelector('[data-role="finalAnswer"]');
              answer.disabled=false;
              this.el('actions').innerHTML=`<button class="action-btn" data-role="checkAnswer">정답 확인</button>`;
              this.el('actions').querySelector('[data-role="checkAnswer"]').addEventListener('click',()=>this.checkFinal());
              this.setMessage('좋아요! 원래 식은 그대로 두고, 10이 되는 두 수만 표시했어요.','good');
              this.locked=false;
              requestAnimationFrame(()=>this.drawPairBracket());
              this.setActiveInput(answer);
            }else{
              this.failAndRestart('10이 되지 않아요.');
            }
          }
        }

        drawPairBracket(){
          if(this.mode!=='pair'||this.phase!=='answer'||this.selected.length!==2)return;
          const work=this.el('work');
          const wrap=work.querySelector('[data-role="pairFixed"]');
          const svg=work.querySelector('[data-role="pairSvg"]');
          const nums=[...work.querySelectorAll('[data-role="pairNum"]')];
          const selectedEls=this.selected.map(i=>nums[i]);
          if(!wrap||!svg||selectedEls.some(x=>!x))return;

          const wr=wrap.getBoundingClientRect();
          const r1=selectedEls[0].getBoundingClientRect();
          const r2=selectedEls[1].getBoundingClientRect();
          const p1={x:r1.left-wr.left+r1.width/2,y:r1.bottom-wr.top+4};
          const p2={x:r2.left-wr.left+r2.width/2,y:r2.bottom-wr.top+4};
          const low=Math.max(p1.y,p2.y)+34;
          const center=(p1.x+p2.x)/2;

          svg.setAttribute('viewBox',`0 0 ${wr.width} ${wr.height}`);
          svg.innerHTML=`
            <path d="M ${p1.x} ${p1.y} Q ${p1.x} ${low-12} ${center} ${low}" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
            <path d="M ${p2.x} ${p2.y} Q ${p2.x} ${low-12} ${center} ${low}" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
            <text x="${center}" y="${low+20}" text-anchor="middle" font-size="11" font-weight="900" fill="#15803d">10 짝꿍</text>`;
        }

        /* ---------- 최종 답 ---------- */
        checkFinal(){
          if(this.locked||this.phase!=='answer')return;
          const ans=this.el('work').querySelector('[data-role="finalAnswer"]');
          if(!ans||ans.disabled)return;
          const raw=ans.value.trim();
          if(raw===''){
            this.setMessage('답을 입력해 주세요.','info');
            ans.focus();
            return;
          }
          if(Number(raw)===this.q.answer){
            this.locked=true;
            this.setActiveInput(null);
            ans.classList.add('good');
            soundGood();
            this.solved++;
            this.updateProgress();
            if(this.solved>=this.goal){
              this.later(()=>this.finish(),500);
            }else{
              this.setMessage('정답! 다음 문제로 갑니다.','good');
              this.later(()=>this.newQuestion(),650);
            }
          }else{
            ans.classList.add('bad');
            this.failAndRestart('답이 달라요.');
          }
        }

        failAndRestart(text){
          if(this.phase==='failed'||this.phase==='done'||this.phase==='timeup')return;

          this.mistakes++;
          soundBad();
          this.panel.classList.add('fail-flash');

          /* 첫 번째 오답은 점수를 유지하고 같은 문제를 다시 풀어요. */
          if(this.mistakes===1){
            this.locked=true;
            this.setMessage('한 번은 괜찮아요! 다시 해보세요. (오답 1 / 2)','bad');

            this.later(()=>{
              this.panel.classList.remove('fail-flash');
              this.locked=false;
              const work=this.el('work');

              if(this.mode==='pair' && this.phase==='start'){
                this.selected=[];
                work.querySelectorAll('[data-role="pairNum"]').forEach(el=>el.classList.remove('selected','bad'));
                this.setMessage('다시 10이 되는 두 수를 골라보세요.','info');
                return;
              }

              if((this.mode==='carry'||this.mode==='sub1'||this.mode==='sub2') && this.phase==='start'){
                const a=work.querySelector('[data-role="splitA"]');
                const b=work.querySelector('[data-role="splitB"]');
                [a,b].forEach(el=>{if(el){el.value='';el.classList.remove('bad');}});
                this.setMessage('다시 두 수를 입력해보세요. 두 번째 수까지 넣으면 자동 확인돼요.','info');
                if(a)this.setActiveInput(a);
                return;
              }

              if(this.mode==='sub2' && this.phase==='buddy'){
                const buddy=work.querySelector('[data-role="buddyAnswer"]');
                if(buddy){
                  buddy.value='';
                  buddy.classList.remove('bad');
                  this.setActiveInput(buddy);
                }
                this.setMessage(`${this.q.subtrahend}의 10짝꿍수를 다시 구해보세요.`,'info');
                return;
              }

              if(this.phase==='answer'){
                const ans=work.querySelector('[data-role="finalAnswer"]');
                if(ans){
                  ans.value='';
                  ans.classList.remove('bad');
                  this.setActiveInput(ans);
                }
                this.setMessage('답을 다시 계산해보세요.','info');
              }
            },650);
            return;
          }

          /* 두 번째 오답에서 점수를 0으로 되돌리고 새 문제로 넘어갑니다. */
          this.phase='failed';
          this.locked=true;
          this.setActiveInput(null);
          this.setMessage('두 번째 오답이에요. 점수가 0점으로 돌아갑니다.','bad');
          this.el('actions').querySelectorAll('button').forEach(b=>b.disabled=true);

          this.later(()=>{
            this.solved=0;
            this.mistakes=0;
            this.panel.classList.remove('fail-flash');
            this.updateProgress();
            this.newQuestion();
          },1000);
        }

        timeUp(){
          if(this.phase==='done'||this.phase==='timeup')return;
          this.clearTimers();
          this.locked=true;
          this.setActiveInput(null);
          this.phase='timeup';
          this.panel.classList.add('time-up');
          this.el('instruction').textContent='시간 종료!';
          this.el('subhint').textContent='';
          this.el('work').innerHTML=`
            <div class="finish-view">
              <div class="finish-emoji">⏰</div>
              <div class="time-up-title">시간이 끝났어요!</div>
              <div class="time-up-score">${this.solved} / ${this.goal}문제</div>
            </div>`;
          this.el('actions').innerHTML='';
          this.setMessage('','');
          this.updateProgress();
        }

        finish(){
          this.clearTimers();
          this.locked=true;
          this.setActiveInput(null);
          this.phase='done';
          this.panel.classList.add('done');
          this.el('instruction').textContent='목표 달성!';
          this.el('subhint').textContent='';
          this.el('work').innerHTML=`
            <div class="finish-view">
              <div class="finish-emoji">🎉</div>
              <div class="finish-title">목표 달성!</div>
              <div class="finish-text">${this.goal}문제를 모두 맞혔어요.<br>10을 만드는 방법을 잘 익혔어요.</div>
            </div>`;
          this.el('actions').innerHTML='';
          this.setMessage('','');
          soundDone();
          finishRoundOnGoal();
        }
      }

      function startAll(){
        clearGames();
        const board=$('gameBoard');
        board.dataset.count='1';
        board.style.setProperty('--players',1);
        games.push(new PlayerGame(0,mode,goal));
        soundStart();
        startGameClock();
      }

      window.addEventListener('resize',()=>{
        games.forEach(g=>{
          if(g.mode==='carry')g.drawCarryGuide();
          if(g.mode==='sub1'||g.mode==='sub2')g.drawSubGuide();
          if(g.mode==='pair')g.drawPairBracket();
        });
      });

      resetToBlank();
    })();
  </script>
</body>
</html>
